  .map-foot { background: #F5EADB; padding: 12px 24px; font-size: 12.5px; color: #505050;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dot-sample { width: 14px; height: 14px; border-radius: 50%; background: #127854;

  .sample-note { margin-left: auto; font-style: italic; color: #8a8578; }
